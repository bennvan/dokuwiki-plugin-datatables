name: PHP Tests on Linux

on: [push, pull_request]

permissions:
    contents: read

jobs:
    testLinux:
        name: PHP ${{ matrix.php-versions }} DokuWiki ${{ matrix.dokuwiki-branch }}
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

        strategy:
            matrix:
                php-versions: ['8.2', '8.3', '8.4', '8.5']
                dokuwiki-branch: ['master', 'stable']
            fail-fast: false

        steps:
            - name: Checkout DokuWiki
              uses: actions/checkout@v7
              with:
                  repository: dokuwiki/dokuwiki
                  ref: ${{ matrix.dokuwiki-branch }}
                  path: wiki

            - name: Checkout plugin
              uses: actions/checkout@v7
              with:
                  path: wiki/lib/plugins/datatables

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: mbstring, intl, PDO, pdo_sqlite, bz2, gd
                  tools: composer:v2
                  coverage: none
                  ini-values: pcre.jit=0

            - name: Setup PHPUnit
              working-directory: wiki/_test
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run PHPUnit
              working-directory: wiki/_test
              run: vendor/bin/phpunit --verbose --stderr --group plugin_datatables
